# GraphRAG 三库编排：Neo4j + Milvus + PostgreSQL
# 与 config/grag_config.yaml 中默认连接一致：
#   neo4j:    bolt://localhost:7687, 用户 neo4j
#   milvus:   localhost:19530 (standalone 依赖 etcd + minio)
#   postgres: localhost:5432, 数据库 grag, 用户 postgres
#
# 使用方式：
#   cd infrastructure/docker && docker compose up -d
# 密码通过 .env 或环境变量 NEO4J_PASSWORD / POSTGRES_PASSWORD 设置

services:
  neo4j:
    image: neo4j:5.26.0-community
    container_name: grag-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-change-me-in-production}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 1G
    ports:
      - "7474:7474"   # HTTP
      - "7687:7687"   # Bolt
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Milvus 依赖：元数据存储
  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.25
    container_name: grag-milvus-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - milvus_etcd:/etcd
    command: etcd -advertise-client-urls=http://milvus-etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Milvus 依赖：对象存储
  milvus-minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    container_name: grag-milvus-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - milvus_minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Milvus 向量库（standalone，依赖上面两个服务）
  milvus:
    image: milvusdb/milvus:v2.4.15
    container_name: grag-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
      MINIO_REGION: us-east-1
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 90s
    depends_on:
      milvus-etcd: { condition: service_healthy }
      milvus-minio: { condition: service_healthy }

  postgres:
    image: postgres:16-alpine
    container_name: grag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: grag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      TZ: Asia/Shanghai
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5430:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d grag"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  neo4j_data:
  milvus_etcd:
  milvus_minio:
  milvus_data:
  postgres_data:
