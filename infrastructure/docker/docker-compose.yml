# GraphRAG 三库编排：Neo4j + Milvus + PostgreSQL
# 与 config/grag_config.yaml 中默认连接一致：
#   neo4j:    bolt://localhost:7687, 用户 neo4j
#   milvus:   localhost:19530 (standalone 依赖 etcd + minio)
#   postgres: localhost:5432, 数据库 grag, 用户 postgres
#
# 使用方式：
#   cd infrastructure/docker && docker compose up -d
# 密码已在本文件固定写死（不再读取环境变量）：
#   Neo4j 密码：neo4j123456
#   Postgres 密码：postgres123

services:
  neo4j:
    image: neo4j:5-community
    container_name: grag-neo4j
    restart: unless-stopped
    environment:
      # 固定密码，如需修改请同步更新 config/grag_config.yaml 对应的 password_env 或直接改为 password
      NEO4J_AUTH: neo4j/neo4j123456
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 1G
    ports:
      - "7474:7474"   # HTTP
      - "7687:7687"   # Bolt
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Milvus 依赖：元数据存储
  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.25
    container_name: grag-milvus-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - milvus_etcd:/etcd
    command: etcd -advertise-client-urls=http://milvus-etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Milvus 依赖：对象存储
  milvus-minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: grag-milvus-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - milvus_minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Milvus 向量库（standalone，依赖上面两个服务）
  milvus:
    image: milvusdb/milvus:v2.6.11
    container_name: grag-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
      MINIO_REGION: us-east-1
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 90s
    depends_on:
      milvus-etcd: { condition: service_healthy }
      milvus-minio: { condition: service_healthy }

  attu:
    image: zilliz/attu:latest
    container_name: grag-milvus-attu
    restart: unless-stopped
    environment:
      MILVUS_URL: milvus:19530
    ports:
      - "8000:3000"
    depends_on:
      milvus: { condition: service_healthy }

  postgres:
    image: postgres:17
    container_name: grag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: grag
      POSTGRES_USER: postgres
      # 固定密码，如需修改请同步更新 config/grag_config.yaml 或环境变量
      POSTGRES_PASSWORD: postgres123
      TZ: Asia/Shanghai
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5430:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d grag"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  neo4j_data:
  milvus_etcd:
  milvus_minio:
  milvus_data:
  postgres_data:
